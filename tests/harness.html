<!doctype html>
<html lang="zh-CN">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" /><title>拾页开发验收工具（不进入生产构建）</title
  ><style>
    body {
      font: 12px Arial;
      margin: 0;
      background: #ddd;
    }
    header {
      padding: 8px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    button {
      padding: 7px;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 150px);
      border: 0;
    }
    textarea {
      width: 100%;
      height: 50px;
      font: 10px monospace;
    }
    #result {
      padding: 5px;
    }
    #image {
      max-width: 250px;
      max-height: 150px;
    }
  </style>
  <header>
    <button id="saveFail">模拟保存失败</button
    ><button id="saveRestore">恢复本机保存</button
    ><button id="exportFail">模拟 PNG 失败</button
    ><button id="exportRestore">恢复 PNG 导出</button
    ><button id="motion">减少动态效果测试</button
    ><button id="network">检查资源请求</button
    ><button id="clearCapture">清空导出捕获</button
    ><button id="touch">模拟触屏点选与滑动</button
    ><button id="fonts">检查导出字体</button
    ><select id="fixture" aria-label="测试文件组合">
      <option value="pictures">横竖图片</option>
      <option value="replacement">替换图片</option>
      <option value="single">单元素备份</option>
      <option value="twelve">12元素备份</option>
      <option value="thirteen">13元素备份</option>
      <option value="full">无空位备份</option>
      <option value="invalid">坏JSON</option>
      <option value="roundtrip">真实导出备份</option></select
    ><button id="inject">选入测试文件</button
    ><button id="imeStart">模拟中文组合开始</button
    ><button id="imeEnd">模拟中文组合结束</button
    ><span id="mode">正常模式，导出会被此工具捕获</span>
  </header>
  <iframe src="/" title="验收中的拾页应用"></iframe>
  <div id="result" role="status">等待操作</div>
  <textarea id="artifact" aria-label="捕获的导出文件" readonly></textarea
  ><img id="image" alt="导出 PNG 预览" hidden />
  <script type="module">
    if (!import.meta.env.DEV) throw Error("Development only");
    const frame = document.querySelector("iframe"),
      status = document.querySelector("#mode"),
      result = document.querySelector("#result");
    let restoreOpen, restoreBlob;
    document.querySelector("#inject").onclick = async () => {
      const mode = document.querySelector("#fixture").value;
      const names = {
        pictures: ["qa-north.png", "qa-sunlight.png"],
        replacement: ["qa-replacement.png"],
        single: ["capacity-1.json"],
        twelve: ["capacity-12.json"],
        thirteen: ["capacity-13.json"],
        full: ["no-space.json"],
        invalid: ["invalid.json"],
        roundtrip: ["roundtrip.json"],
      }[mode];
      const doc = frame.contentDocument,
        win = frame.contentWindow;
      const input =
        mode === "replacement"
          ? doc.querySelectorAll('.studio input[type="file"]')[1]
          : mode === "pictures"
            ? doc.querySelector('.studio input[type="file"]')
            : doc.querySelector('input[accept*="json"]');
      if (!input) {
        result.textContent = "先进入工作台";
        return;
      }
      const transfer = new win.DataTransfer();
      for (const name of names) {
        const blob = await (await fetch("./fixtures/" + name)).blob();
        transfer.items.add(
          new win.File([blob], name, {
            type: name.endsWith(".json") ? "application/json" : "image/png",
          }),
        );
      }
      input.files = transfer.files;
      input.dispatchEvent(new win.Event("change", { bubbles: true }));
      result.textContent = "已模拟文件选择：" + names.join("、");
    };
    for (const [id, type] of [
      ["imeStart", "compositionstart"],
      ["imeEnd", "compositionend"],
    ])
      document.querySelector("#" + id).onclick = () => {
        const win = frame.contentWindow,
          field = frame.contentDocument.querySelector(".notes-form textarea");
        field?.dispatchEvent(
          new win.CompositionEvent(type, { bubbles: true, data: "中文" }),
        );
        result.textContent = type;
      };
    document.querySelector("#clearCapture").onclick = () => {
      document.querySelector("#artifact").value = "";
      result.textContent = "等待操作";
    };
    document.querySelector("#touch").onclick = () => {
      const win = frame.contentWindow,
        item = frame.contentDocument.querySelector(".board-item");
      if (!item) {
        result.textContent = "先打开一份有内容的方案";
        return;
      }
      const before = item.style.cssText,
        rect = item.getBoundingClientRect();
      for (const [type, delta] of [
        ["pointerdown", 0],
        ["pointermove", 80],
        ["pointerup", 80],
      ]) {
        item.dispatchEvent(
          new win.PointerEvent(type, {
            bubbles: true,
            pointerId: 91,
            pointerType: "touch",
            button: 0,
            clientX: rect.x + 20,
            clientY: rect.y + 20 + delta,
          }),
        );
      }
      item.click();
      requestAnimationFrame(() => {
        result.textContent = JSON.stringify({
          simulatedPointerType: "touch",
          selectionVisible: item.classList.contains("selected"),
          geometryUnchanged: before === item.style.cssText,
          touchAction: win.getComputedStyle(item).touchAction,
        });
      });
    };
    document.querySelector("#fonts").onclick = async () => {
      const doc = frame.contentDocument;
      await doc.fonts.ready;
      result.textContent = JSON.stringify({
        ready: doc.fonts.status,
        canvasFontAvailable: doc.fonts.check('18px "Microsoft YaHei"'),
        scope: "current Windows Chromium only",
      });
    };
    frame.addEventListener("load", () => {
      const win = frame.contentWindow;
      restoreOpen = win.indexedDB.open.bind(win.indexedDB);
      restoreBlob = win.HTMLCanvasElement.prototype.toBlob;
      win.document.addEventListener(
        "click",
        async (e) => {
          const a = e.target.closest("a[download]");
          if (!a) return;
          e.preventDefault();
          const blob = await (await fetch(a.href)).blob();
          const reader = new FileReader();
          reader.onload = () => {
            document.querySelector("#artifact").value = reader.result;
            result.textContent = JSON.stringify({
              name: a.download,
              size: blob.size,
              type: blob.type,
            });
            if (blob.type === "image/png") {
              const im = document.querySelector("#image");
              im.src = reader.result;
              im.hidden = false;
              im.onload = () =>
                (result.textContent +=
                  " dimensions=" + im.naturalWidth + "×" + im.naturalHeight);
            }
          };
          reader.readAsDataURL(blob);
        },
        true,
      );
    });
    document.querySelector("#saveFail").onclick = () => {
      frame.contentWindow.indexedDB.open = () => {
        throw new DOMException("QA quota failure", "QuotaExceededError");
      };
      status.textContent = "保存失败模拟已启用";
    };
    document.querySelector("#saveRestore").onclick = () => {
      frame.contentWindow.indexedDB.open = restoreOpen;
      status.textContent = "本机保存已恢复";
    };
    document.querySelector("#exportFail").onclick = () => {
      frame.contentWindow.HTMLCanvasElement.prototype.toBlob = function (cb) {
        cb(null);
      };
      status.textContent = "PNG 失败模拟已启用";
    };
    document.querySelector("#exportRestore").onclick = () => {
      frame.contentWindow.HTMLCanvasElement.prototype.toBlob = restoreBlob;
      status.textContent = "PNG 导出已恢复";
    };
    document.querySelector("#motion").onclick = () => {
      const style = frame.contentDocument.createElement("style");
      style.textContent =
        "*,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important}";
      frame.contentDocument.head.append(style);
      status.textContent =
        "已应用与减少动态效果规则相同的覆盖样式（非操作系统模拟）";
    };
    document.querySelector("#network").onclick = () => {
      result.textContent = JSON.stringify(
        frame.contentWindow.performance
          .getEntriesByType("resource")
          .map((x) => x.name)
          .filter((x) => /^https?:/.test(x)),
      );
    };
  </script>
</html>
